
[project]
name = "mira-backend"
version = "0.1.0"
description = "Backend services for the MIRA intelligent automotive assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "fastmcp==4.1.4",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langgraph==1.2.18",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
